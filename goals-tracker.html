<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISSION BOARD</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070709;
    --surface: #0f0f13;
    --surface2: #16161c;
    --border: #1e1e28;
    --accent: #e8c547;
    --accent-dim: rgba(232,197,71,0.12);
    --accent-glow: rgba(232,197,71,0.35);
    --green: #39e07a;
    --green-dim: rgba(57,224,122,0.1);
    --red: #ff4d4d;
    --red-dim: rgba(255,77,77,0.12);
    --orange: #ff8c42;
    --purple: #9b6dff;
    --text: #eeeef5;
    --muted: #555566;
    --muted2: #333340;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BACKGROUND GRID */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,197,71,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,197,71,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 60% 20%, rgba(232,197,71,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 80%, rgba(155,109,255,0.03) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 50px;
    padding-bottom: 30px;
    border-bottom: 1px solid var(--border);
  }

  .header-left h1 {
    font-family: 'Bebas Neue', cursive;
    font-size: clamp(48px, 10vw, 80px);
    letter-spacing: 6px;
    line-height: 1;
    color: var(--text);
    position: relative;
  }

  .header-left h1 span {
    color: var(--accent);
    text-shadow: 0 0 40px var(--accent-glow);
  }

  .header-left .subtitle {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .header-right {
    text-align: left;
    padding-top: 8px;
  }

  .date-display {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
  }

  .progress-ring-wrap {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-ring {
    transform: rotate(-90deg);
  }

  .progress-ring circle {
    transition: stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1);
    stroke-linecap: round;
  }

  .progress-label {
    font-family: 'Bebas Neue', cursive;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--accent);
  }

  .progress-sublabel {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 2px;
    margin-bottom: 36px;
  }

  .stat-block {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    text-align: center;
    transition: border-color 0.2s;
  }

  .stat-block:first-child { border-radius: 8px 0 0 8px; }
  .stat-block:last-child { border-radius: 0 8px 8px 0; }
  .stat-block:hover { border-color: var(--muted2); }

  .stat-num {
    font-family: 'Bebas Neue', cursive;
    font-size: 32px;
    letter-spacing: 2px;
    line-height: 1;
  }

  .stat-num.total { color: var(--text); }
  .stat-num.active { color: var(--accent); }
  .stat-num.done { color: var(--green); }

  .stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ADD FORM */
  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 32px;
    transition: border-color 0.3s;
  }

  .add-form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 30px var(--accent-dim);
  }

  .form-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .form-row:last-child { margin-bottom: 0; }

  input[type="text"], textarea, select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    border-radius: 8px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
  }

  input[type="text"]:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim);
  }

  input::placeholder, textarea::placeholder {
    color: var(--muted);
  }

  textarea {
    resize: none;
    height: 80px;
    line-height: 1.6;
  }

  select {
    cursor: pointer;
    flex-shrink: 0;
    width: auto;
    min-width: 130px;
  }

  select option {
    background: var(--surface2);
  }

  .btn-add {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Bebas Neue', cursive;
    font-size: 18px;
    letter-spacing: 3px;
    padding: 12px 28px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .btn-add:hover {
    background: #f5d460;
    transform: translateY(-1px);
    box-shadow: 0 8px 25px var(--accent-glow);
  }

  .btn-add:active { transform: translateY(0); }

  /* FILTERS */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover { border-color: var(--muted2); color: var(--text); }

  .filter-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* SECTION HEADERS */
  .section-header {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    padding-right: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ITEMS LIST */
  .items-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    animation: slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    overflow: hidden;
  }

  .item-card::before {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    border-radius: 0 10px 10px 0;
    transition: opacity 0.2s;
  }

  .item-card.priority-high::before { background: var(--red); }
  .item-card.priority-medium::before { background: var(--orange); }
  .item-card.priority-low::before { background: var(--purple); }
  .item-card.type-note::before { background: var(--muted); }

  .item-card:hover {
    border-color: var(--muted2);
    transform: translateX(-2px);
    background: var(--surface2);
  }

  .item-card.completed {
    opacity: 0.5;
    border-color: var(--green-dim);
  }

  .item-card.completed::before { background: var(--green) !important; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes completeFlash {
    0% { background: var(--surface); }
    50% { background: var(--green-dim); }
    100% { background: var(--surface); }
  }

  .item-card.just-completed {
    animation: completeFlash 0.6s ease;
  }

  /* CHECKBOX */
  .check-btn {
    width: 24px;
    height: 24px;
    min-width: 24px;
    border-radius: 6px;
    border: 2px solid var(--muted2);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: all 0.2s;
    font-size: 13px;
  }

  .check-btn:hover {
    border-color: var(--green);
    background: var(--green-dim);
    color: var(--green);
  }

  .item-card.completed .check-btn {
    border-color: var(--green);
    background: var(--green-dim);
    color: var(--green);
  }

  /* ITEM CONTENT */
  .item-content { flex: 1; min-width: 0; }

  .item-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }

  .item-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    transition: all 0.2s;
  }

  .item-card.completed .item-title {
    text-decoration: line-through;
    color: var(--muted);
  }

  .item-body {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
    margin-top: 6px;
    font-weight: 300;
  }

  .item-card.completed .item-body {
    text-decoration: line-through;
  }

  .item-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 700;
  }

  .badge-goal { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(232,197,71,0.2); }
  .badge-note { background: rgba(100,100,130,0.15); color: var(--muted); border: 1px solid var(--border); }
  .badge-high { background: var(--red-dim); color: var(--red); border: 1px solid rgba(255,77,77,0.2); }
  .badge-medium { background: rgba(255,140,66,0.1); color: var(--orange); border: 1px solid rgba(255,140,66,0.2); }
  .badge-low { background: rgba(155,109,255,0.1); color: var(--purple); border: 1px solid rgba(155,109,255,0.2); }
  .badge-done { background: var(--green-dim); color: var(--green); border: 1px solid rgba(57,224,122,0.2); }

  .item-time {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-right: auto;
  }

  /* ACTIONS */
  .item-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .item-card:hover .item-actions { opacity: 1; }

  .action-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.15s;
  }

  .action-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  .empty-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--muted2);
    margin-bottom: 8px;
  }

  .empty-sub {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
  }

  /* MOTIVATIONAL BAR */
  .motive-bar {
    margin-bottom: 32px;
    padding: 16px 20px;
    background: var(--accent-dim);
    border: 1px solid rgba(232,197,71,0.15);
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .motive-icon {
    font-size: 20px;
    flex-shrink: 0;
  }

  .motive-text {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: rgba(232,197,71,0.8);
    letter-spacing: 1px;
    line-height: 1.6;
  }

  /* CLEAR COMPLETED */
  .actions-bar {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
  }

  .btn-clear {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-clear:hover {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-dim);
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 2px; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .container { padding: 20px 16px; }
    .header { flex-direction: column; gap: 16px; }
    .header-right { text-align: right; }
    .form-row { flex-direction: column; }
    .btn-add { width: 100%; }
    .item-actions { opacity: 1; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <h1>MISSION <span>BOARD</span></h1>
      <div class="subtitle">// أهدافي — ملاحظاتي — إنجازاتي</div>
    </div>
    <div class="header-right">
      <div class="date-display" id="dateDisplay">—</div>
      <div class="progress-ring-wrap">
        <svg class="progress-ring" width="54" height="54">
          <circle cx="27" cy="27" r="22" fill="none" stroke="#1e1e28" stroke-width="3"/>
          <circle id="progressCircle" cx="27" cy="27" r="22" fill="none"
            stroke="#e8c547" stroke-width="3"
            stroke-dasharray="138.2"
            stroke-dashoffset="138.2"/>
        </svg>
        <div>
          <div class="progress-label" id="progressLabel">0%</div>
          <div class="progress-sublabel">مُنجز</div>
        </div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-block">
      <div class="stat-num total" id="statTotal">0</div>
      <div class="stat-label">الكل</div>
    </div>
    <div class="stat-block">
      <div class="stat-num active" id="statActive">0</div>
      <div class="stat-label">قيد التنفيذ</div>
    </div>
    <div class="stat-block">
      <div class="stat-num done" id="statDone">0</div>
      <div class="stat-label">مُنجز</div>
    </div>
  </div>

  <!-- MOTIVATIONAL -->
  <div class="motive-bar" id="motiveBar">
    <div class="motive-icon">⚡</div>
    <div class="motive-text" id="motiveText">ابدأ بأصعب مهمة أولاً — كل شيء بعدها يصبح أسهل.</div>
  </div>

  <!-- ADD FORM -->
  <div class="add-form">
    <div class="form-row">
      <input type="text" id="inputTitle" placeholder="أضف هدف أو ملاحظة..." maxlength="120">
    </div>
    <div class="form-row">
      <textarea id="inputBody" placeholder="تفاصيل إضافية (اختياري)..."></textarea>
    </div>
    <div class="form-row">
      <select id="inputType">
        <option value="goal">🎯 هدف</option>
        <option value="note">📝 ملاحظة</option>
      </select>
      <select id="inputPriority">
        <option value="high">🔴 أولوية عالية</option>
        <option value="medium">🟠 أولوية متوسطة</option>
        <option value="low">🟣 أولوية منخفضة</option>
      </select>
      <button class="btn-add" onclick="addItem()">+ أضف</button>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">الكل</button>
    <button class="filter-btn" onclick="setFilter('goal', this)">أهداف</button>
    <button class="filter-btn" onclick="setFilter('note', this)">ملاحظات</button>
    <button class="filter-btn" onclick="setFilter('active', this)">قيد التنفيذ</button>
    <button class="filter-btn" onclick="setFilter('done', this)">مُنجز</button>
  </div>

  <!-- LIST -->
  <div class="section-header" id="listLabel">المهام النشطة</div>
  <div class="items-list" id="itemsList"></div>

  <div class="actions-bar">
    <button class="btn-clear" onclick="clearCompleted()">حذف المنجزة</button>
  </div>

</div>

<script>
  const QUOTES = [
    "ابدأ بأصعب مهمة أولاً — كل شيء بعدها يصبح أسهل.",
    "الانضباط يبني ما لا يستطيع الحماس وحده بناؤه.",
    "كل هدف كتبته هو التزام مع نفسك — لا تخذلها.",
    "النجاح ليس حظاً — هو قرارات صغيرة متراكمة.",
    "ما تقيسه تستطيع تحسينه. ابدأ الآن.",
    "التركيز ليس فعل شيء واحد — هو رفض كل ما عداه.",
    "خطوة واحدة اليوم أفضل من خطط لا تُنفَّذ.",
    "الأهداف المكتوبة حقيقية. الأهداف في رأسك أوهام."
  ];

  let items = JSON.parse(localStorage.getItem('missionItems') || '[]');
  let currentFilter = 'all';

  function save() {
    localStorage.setItem('missionItems', JSON.stringify(items));
  }

  function addItem() {
    const title = document.getElementById('inputTitle').value.trim();
    if (!title) {
      document.getElementById('inputTitle').focus();
      document.getElementById('inputTitle').style.borderColor = 'var(--red)';
      setTimeout(() => document.getElementById('inputTitle').style.borderColor = '', 800);
      return;
    }

    const item = {
      id: Date.now(),
      title,
      body: document.getElementById('inputBody').value.trim(),
      type: document.getElementById('inputType').value,
      priority: document.getElementById('inputPriority').value,
      done: false,
      createdAt: new Date().toISOString()
    };

    items.unshift(item);
    save();
    render();

    document.getElementById('inputTitle').value = '';
    document.getElementById('inputBody').value = '';
    document.getElementById('inputTitle').focus();
    updateMotivation();
  }

  function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    item.done = !item.done;
    save();
    render();

    if (item.done) {
      const card = document.querySelector(`[data-id="${id}"]`);
      if (card) {
        card.classList.add('just-completed');
        setTimeout(() => card.classList.remove('just-completed'), 600);
      }
    }
    updateMotivation();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    save();
    render();
    updateMotivation();
  }

  function clearCompleted() {
    items = items.filter(i => !i.done);
    save();
    render();
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function getFiltered() {
    return items.filter(item => {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'goal') return item.type === 'goal';
      if (currentFilter === 'note') return item.type === 'note';
      if (currentFilter === 'active') return !item.done;
      if (currentFilter === 'done') return item.done;
      return true;
    });
  }

  function timeAgo(iso) {
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);
    if (mins < 1) return 'الآن';
    if (mins < 60) return `منذ ${mins} دقيقة`;
    if (hours < 24) return `منذ ${hours} ساعة`;
    return `منذ ${days} يوم`;
  }

  function render() {
    const filtered = getFiltered();
    const list = document.getElementById('itemsList');
    const total = items.length;
    const done = items.filter(i => i.done).length;
    const active = total - done;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statActive').textContent = active;
    document.getElementById('statDone').textContent = done;

    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    document.getElementById('progressLabel').textContent = pct + '%';
    const circumference = 138.2;
    const offset = circumference - (pct / 100) * circumference;
    document.getElementById('progressCircle').style.strokeDashoffset = offset;

    const labels = {
      all: 'جميع العناصر',
      goal: 'الأهداف',
      note: 'الملاحظات',
      active: 'قيد التنفيذ',
      done: 'المُنجزة'
    };
    document.getElementById('listLabel').textContent = labels[currentFilter] || 'العناصر';

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">${currentFilter === 'done' ? '🏆' : '🎯'}</div>
          <div class="empty-title">${currentFilter === 'done' ? 'لا يوجد منجز بعد' : 'لا يوجد شيء هنا'}</div>
          <div class="empty-sub">// أضف أول ${currentFilter === 'note' ? 'ملاحظة' : 'هدف'} لك</div>
        </div>
      `;
      return;
    }

    list.innerHTML = filtered.map(item => `
      <div class="item-card ${item.done ? 'completed' : ''} priority-${item.priority} ${item.type === 'note' ? 'type-note' : ''}" data-id="${item.id}">
        <button class="check-btn" onclick="toggleItem(${item.id})" title="${item.done ? 'إلغاء الإنجاز' : 'إتمام'}">
          ${item.done ? '✓' : ''}
        </button>
        <div class="item-content">
          <div class="item-header">
            <div class="item-title">${escapeHtml(item.title)}</div>
          </div>
          ${item.body ? `<div class="item-body">${escapeHtml(item.body)}</div>` : ''}
          <div class="item-meta">
            <span class="badge badge-${item.type}">${item.type === 'goal' ? '🎯 هدف' : '📝 ملاحظة'}</span>
            ${!item.done ? `<span class="badge badge-${item.priority}">${item.priority === 'high' ? '🔴 عالية' : item.priority === 'medium' ? '🟠 متوسطة' : '🟣 منخفضة'}</span>` : ''}
            ${item.done ? `<span class="badge badge-done">✓ مُنجز</span>` : ''}
            <span class="item-time">${timeAgo(item.createdAt)}</span>
          </div>
        </div>
        <div class="item-actions">
          <button class="action-btn" onclick="deleteItem(${item.id})" title="حذف">✕</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function updateDate() {
    const now = new Date();
    const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('dateDisplay').textContent = now.toLocaleDateString('ar-JO', opts);
  }

  function updateMotivation() {
    const done = items.filter(i => i.done).length;
    const total = items.length;
    let q;
    if (total === 0) q = QUOTES[0];
    else if (done === total && total > 0) q = "🏆 أنجزت كل شيء! أنت تستحق الاحترام.";
    else q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    document.getElementById('motiveText').textContent = q;
  }

  // Enter key to add
  document.getElementById('inputTitle').addEventListener('keydown', e => {
    if (e.key === 'Enter') addItem();
  });

  updateDate();
  setInterval(updateDate, 60000);
  updateMotivation();
  render();
</script>
</body>
</html>
